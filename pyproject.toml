[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldcache"
version = "0.1.0"
description = "Find the GitHub Actions caches that never hit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["github-actions", "workflows", "ci", "cache", "linter", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
coldcache = "coldcache.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/coldcache"

[tool.hatch.build.targets.wheel]
packages = ["src/coldcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
